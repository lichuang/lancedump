[package]
name = "lancedump"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Read-only inspector for Lance data files"
license = "Apache-2.0"
publish = false

[[bin]]
name = "ldp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
prost = "0.14.1"
prost-types = "0.14.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
prost-build = "0.14.1"
protobuf-src = { version = "2.1", optional = true }

[features]
default = []
# Build protoc from source instead of relying on a system installation.
vendored-protoc = ["dep:protobuf-src"]
